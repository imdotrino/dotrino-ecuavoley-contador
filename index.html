<style>
  /* touch-action: manipulation → en iOS el doble-tap NO hace zoom (Safari ignora
     user-scalable=no desde iOS 10); además quita el delay de 300ms al tocar. */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  html, body {
    height: 100%;
    overflow: hidden;
    font-family: var(--dt-font);
    user-select: none;
    -webkit-user-select: none;
  }
  body {
    display: flex;
    flex-direction: column;
    background: var(--dt-bg);
  }

  /* --- Barra superior: estilos del light DOM para <dotrino-topbar> --- */
  dotrino-topbar button {
    border: none;
    background: transparent;
    color: var(--dt-text-dim);
    font-size: 1.9vh;
    font-weight: 700;
    padding: 1.4vh 0;
    text-transform: uppercase;
    letter-spacing: .05em;
    cursor: pointer;
  }
  dotrino-topbar button:active { color: var(--dt-text); }

  /* --- Marcador --- */
  .board {
    flex: 1;
    display: flex;
    min-height: 0;
  }
  .team {
    flex: 1 1 0;
    min-width: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #fff;
    transition: background-color .2s;
    cursor: pointer;
    position: relative;
    overflow: hidden;
  }
  .team.left { background: #1d4ed8; }
  .team.right { background: #b91c1c; }

  /* equipo sin cambio: atenuado y no marca */
  .team:not(.active) {
    filter: brightness(.45) saturate(.6);
  }
  .team:not(.active) .points { opacity: .8; }

  .name-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5vw;
    width: 100%;
    padding: 0 2vw;
    margin-bottom: 1vh;
  }
  .name {
    font-size: min(4.2vw, 4.6vh);
    font-weight: 700;
    letter-spacing: .03em;
    text-transform: uppercase;
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    color: #fff;
    text-align: center;
    flex: 1 1 0;
    min-width: 0;
    width: 100%;
  }
  .name:focus {
    outline: none;
    border-bottom-color: rgba(255,255,255,.6);
  }
  .edit-name {
    width: 7vw;
    height: 7vw;
    max-width: 32px;
    max-height: 32px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,.5);
    background: rgba(255,255,255,.12);
    color: #fff;
    font-size: 3.5vw;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    padding: 0;
  }
  .edit-name:active { background: rgba(255,255,255,.3); }
  .points {
    font-size: min(30vw, 42vh);
    font-weight: 800;
    line-height: 1;
    font-variant-numeric: tabular-nums;
  }
  .arrows {
    display: flex;
    gap: 4vw;
    margin-top: 1vh;
  }
  .arrows button {
    width: min(13vw, 9vh);
    height: min(13vw, 9vh);
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,.6);
    background: rgba(255,255,255,.12);
    color: #fff;
    font-size: min(6vw, 4.2vh);
    font-weight: 800;
    line-height: 1;
    cursor: pointer;
  }
  .arrows button:active { background: rgba(255,255,255,.35); }
  .serve {
    margin-top: 1.5vh;
    height: 3.2vh;
    font-size: 2.6vh;
    font-weight: 700;
    letter-spacing: .12em;
  }
  .team.active .serve::after { content: "● SAQUE"; }

  .tap {
    position: absolute;
    font-size: 12vh;
    font-weight: 800;
    opacity: 0;
    pointer-events: none;
  }
  @keyframes pop {
    0%   { opacity: .9; transform: scale(.4); }
    100% { opacity: 0;  transform: scale(1.6); }
  }
  .tap.anim { animation: pop .5s ease-out; }

  /* --- Barra de control --- */
  .control {
    display: flex;
    background: var(--dt-surface);
    border-top: 2px solid var(--dt-line-soft);
  }
  .control button {
    flex: 1;
    border: none;
    background: transparent;
    color: var(--dt-text-dim);
    font-size: 1.9vh;
    font-weight: 700;
    padding: 1.6vh 0;
    text-transform: uppercase;
    letter-spacing: .05em;
    cursor: pointer;
  }
  .control button:active { background: var(--dt-surface-3); }
  .btn-switch {
    background: var(--dt-accent) !important;
    color: var(--dt-accent-ink) !important;
    font-size: 2.4vh !important;
  }
  .btn-switch:active { background: var(--dt-accent-press) !important; }

  .winner {
    position: absolute;
    top: 1.2vh;
    font-size: 2.4vh;
    font-weight: 800;
    color: #fde047;
  }

  /* --- Modal de resultados --- */
  .modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.75);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 10;
    padding: 4vh 4vw;
  }
  .modal.open { display: flex; }
  .modal-box {
    background: var(--dt-surface);
    color: var(--dt-text);
    border-radius: 12px;
    width: 100%;
    max-width: 520px;
    max-height: 100%;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .modal-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 2vh 4vw;
    border-bottom: 1px solid var(--dt-line-soft);
  }
  .modal-head h2 {
    font-size: 2.4vh;
    font-weight: 800;
    letter-spacing: .05em;
    text-transform: uppercase;
  }
  .modal-close {
    background: transparent;
    border: none;
    color: var(--dt-text);
    font-size: 3vh;
    cursor: pointer;
    padding: 0 1vw;
  }
  .modal-body {
    overflow-y: auto;
    padding: 1vh 0;
  }
  .result {
    display: flex;
    align-items: center;
    gap: 2vw;
    padding: 1.5vh 4vw;
    border-bottom: 1px solid var(--dt-line-soft);
  }
  .result:last-child { border-bottom: none; }
  .result-info {
    flex: 1;
    min-width: 0;
  }
  .result-date {
    font-size: 1.5vh;
    color: var(--dt-text-dim);
    margin-bottom: .4vh;
  }
  .result-score {
    font-size: 2.1vh;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .result-score .wins { color: var(--dt-gold); }
  .delete {
    background: #b91c1c;
    border: none;
    color: #fff;
    border-radius: 8px;
    padding: 1vh 3vw;
    font-size: 1.8vh;
    font-weight: 700;
    cursor: pointer;
    flex-shrink: 0;
  }
  .delete:active { background: #7f1d1d; }
  .empty {
    padding: 4vh 4vw;
    text-align: center;
    color: var(--dt-text-dim);
    font-size: 2vh;
  }
  /* --- Confirmación propia (nada de confirm() del navegador, CONVENCIONES §5) --- */
  .confirm-text {
    padding: 3vh 4vw 2vh;
    font-size: 2vh;
  }
  .modal-actions {
    display: flex;
    gap: 3vw;
    justify-content: flex-end;
    padding: 0 4vw 2.5vh;
  }
  .modal-actions button {
    border: none;
    border-radius: 8px;
    padding: 1.2vh 4vw;
    font-size: 1.9vh;
    font-weight: 700;
    cursor: pointer;
    background: var(--dt-surface-3);
    color: var(--dt-text);
  }
  .modal-actions .primary {
    background: var(--dt-accent);
    color: var(--dt-accent-ink);
  }
</style>

<body>
    <!--dotrino-prerender--><main id="dotrino-prerender"><h1>Marcador Ecuavóley</h1><p>Marcador para partidos de ecuavóley: dos paneles táctiles, indicador de saque, deshacer, cambio y reinicio. Gana el primero en llegar a 15.</p><p><a href="https://dotrino.com/">Todas las aplicaciones de Dotrino</a> · <a href="https://wiki.dotrino.com/">Documentación</a></p></main><script>document.getElementById('dotrino-prerender').remove()</script><!--/dotrino-prerender-->

  <dotrino-topbar brand="Ecuavóley" icon="./icon.svg"
    support-repo="imdotrino/dotrino-ecuavoley-contador"
    support-discord="https://discord.gg/D648uq7cth"
    profile theme no-lang>
    <button id="btnResults">📋 Resultados</button>
    <button id="btnInstall" style="display:none">⬇ Instalar</button>
  </dotrino-topbar>

  <div class="board">
    <div class="team left active" id="teamLeft">
      <div class="name-wrap">
        <input class="name" id="nameLeft" value="Equipo A" maxlength="14" readonly>
        <button class="edit-name" data-target="nameLeft" title="Editar nombre">✎</button>
      </div>
      <div class="points" id="ptsLeft">0</div>
      <div class="arrows">
        <button data-side="left" data-delta="-1">−</button>
        <button data-side="left" data-delta="1">+</button>
      </div>
      <div class="serve"></div>
      <div class="winner" id="winLeft"></div>
      <div class="tap" id="tapLeft">+1</div>
    </div>
    <div class="team right" id="teamRight">
      <div class="name-wrap">
        <input class="name" id="nameRight" value="Equipo B" maxlength="14" readonly>
        <button class="edit-name" data-target="nameRight" title="Editar nombre">✎</button>
      </div>
      <div class="points" id="ptsRight">0</div>
      <div class="arrows">
        <button data-side="right" data-delta="-1">−</button>
        <button data-side="right" data-delta="1">+</button>
      </div>
      <div class="serve"></div>
      <div class="winner" id="winRight"></div>
      <div class="tap" id="tapRight">+1</div>
    </div>
  </div>

  <div class="control">
    <button id="btnUndo">↶ Deshacer</button>
    <button class="btn-switch" id="btnSwitch">⇄ Cambio</button>
    <button id="btnNew">+ Nuevo</button>
  </div>

  <div class="modal" id="modalResults">
    <div class="modal-box">
      <div class="modal-head">
        <h2>Resultados</h2>
        <button class="modal-close" id="btnCloseModal">✕</button>
      </div>
      <div class="modal-body" id="resultsList"></div>
    </div>
  </div>

  <div class="modal" id="modalConfirmNew">
    <div class="modal-box">
      <div class="confirm-text">¿Iniciar un nuevo partido? Se guardará el marcador actual.</div>
      <div class="modal-actions">
        <button id="btnConfirmNo">Cancelar</button>
        <button class="primary" id="btnConfirmYes">Nuevo partido</button>
      </div>
    </div>
  </div>

<script>
  // Ecuavóley: gana el primero en llegar a 15 puntos.
  const TARGET = 15;
  const RESULTS_KEY = 'ecuavoley_results';
  const CURRENT_KEY = 'ecuavoley_current';

  // migration: remove after 2027-01-01
  // Hasta 2026-10 las claves y los campos guardados iban en español ('voley_resultados',
  // 'voley_actual', izq/der/cambio/historial/nomIzq/nomDer/fecha). Se traducen una vez
  // al formato nuevo y se borran las viejas; si ya existe la clave nueva, no se toca nada.
  function migrateLegacyStorage() {
    const side = s => (s === 'der' ? 'right' : 'left');
    const oldResults = localStorage.getItem('voley_resultados');
    if (oldResults !== null) {
      if (localStorage.getItem(RESULTS_KEY) === null) {
        const arr = JSON.parse(oldResults) || [];
        localStorage.setItem(RESULTS_KEY, JSON.stringify(arr.map(r => ({
          date: r.fecha, leftName: r.nomIzq, rightName: r.nomDer, left: r.izq, right: r.der
        }))));
      }
      localStorage.removeItem('voley_resultados');
    }
    const oldCurrent = localStorage.getItem('voley_actual');
    if (oldCurrent !== null) {
      if (localStorage.getItem(CURRENT_KEY) === null) {
        const d = JSON.parse(oldCurrent);
        if (d) {
          localStorage.setItem(CURRENT_KEY, JSON.stringify({
            left: d.izq, right: d.der, serve: side(d.cambio),
            history: (Array.isArray(d.historial) ? d.historial : [])
              .map(h => ({ left: h.izq, right: h.der, serve: side(h.cambio) })),
            leftName: d.nomIzq, rightName: d.nomDer
          }));
        }
      }
      localStorage.removeItem('voley_actual');
    }
  }

  const state = {
    left: 0,
    right: 0,
    serve: 'left',   // equipo que tiene el saque
    history: []      // para deshacer
  };

  function saveCurrent() {
    localStorage.setItem(CURRENT_KEY, JSON.stringify({
      left: state.left,
      right: state.right,
      serve: state.serve,
      history: state.history,
      leftName: $('nameLeft') ? $('nameLeft').value : 'Equipo A',
      rightName: $('nameRight') ? $('nameRight').value : 'Equipo B'
    }));
  }
  function loadCurrent() {
    try {
      const d = JSON.parse(localStorage.getItem(CURRENT_KEY));
      if (!d) return;
      state.left = d.left || 0;
      state.right = d.right || 0;
      state.serve = d.serve || 'left';
      state.history = Array.isArray(d.history) ? d.history : [];
      if (d.leftName) $('nameLeft').value = d.leftName;
      if (d.rightName) $('nameRight').value = d.rightName;
    } catch {}
  }

  const $ = id => document.getElementById(id);

  function render() {
    $('ptsLeft').textContent = state.left;
    $('ptsRight').textContent = state.right;
    $('teamLeft').classList.toggle('active', state.serve === 'left');
    $('teamRight').classList.toggle('active', state.serve === 'right');
    saveCurrent();
  }

  function pushHistory() {
    state.history.push({ left: state.left, right: state.right, serve: state.serve });
  }

  function addPoint(side) {
    if (state.serve !== side) {       // tocar el lado sin saque = cambio
      switchServe();
      return;
    }
    pushHistory();
    state[side]++;
    animateTap(side);
    render();
  }

  function animateTap(side) {
    const el = side === 'left' ? $('tapLeft') : $('tapRight');
    el.classList.remove('anim');
    void el.offsetWidth; // reinicia la animación
    el.classList.add('anim');
  }

  // Ajuste manual del puntaje, independiente del saque y del estado del partido.
  function adjust(side, delta) {
    const next = state[side] + delta;
    if (next < 0) return;
    pushHistory();
    state[side] = next;
    render();
  }

  function switchServe() {
    pushHistory();
    state.serve = state.serve === 'left' ? 'right' : 'left';
    render();
  }

  function undo() {
    const prev = state.history.pop();
    if (!prev) return;
    state.left = prev.left;
    state.right = prev.right;
    state.serve = prev.serve;
    render();
  }

  // --- Resultados guardados ---
  function readResults() {
    try {
      return JSON.parse(localStorage.getItem(RESULTS_KEY)) || [];
    } catch { return []; }
  }
  function writeResults(arr) {
    localStorage.setItem(RESULTS_KEY, JSON.stringify(arr));
  }

  function resetMatch() {
    state.left = 0;
    state.right = 0;
    state.serve = 'left';
    state.history = [];
    render();
  }

  function newMatch() {
    const hasPoints = state.left > 0 || state.right > 0;
    if (!hasPoints) { resetMatch(); return; }
    $('modalConfirmNew').classList.add('open');
  }

  function confirmNewMatch() {
    $('modalConfirmNew').classList.remove('open');
    const results = readResults();
    results.unshift({
      date: Date.now(),
      leftName: $('nameLeft').value || 'Equipo A',
      rightName: $('nameRight').value || 'Equipo B',
      left: state.left,
      right: state.right
    });
    writeResults(results);
    resetMatch();
  }

  function formatDate(ts) {
    const d = new Date(ts);
    const dd = String(d.getDate()).padStart(2, '0');
    const mm = String(d.getMonth() + 1).padStart(2, '0');
    const hh = String(d.getHours()).padStart(2, '0');
    const mi = String(d.getMinutes()).padStart(2, '0');
    return `${dd}/${mm} ${hh}:${mi}`;
  }

  function renderResults() {
    const list = $('resultsList');
    const results = readResults();
    if (results.length === 0) {
      list.innerHTML = '<div class="empty">No hay resultados guardados.</div>';
      return;
    }
    list.innerHTML = '';
    results.forEach((r, i) => {
      const leftWins = r.left > r.right;
      const rightWins = r.right > r.left;
      const row = document.createElement('div');
      row.className = 'result';
      row.innerHTML = `
        <div class="result-info">
          <div class="result-date">${formatDate(r.date)}</div>
          <div class="result-score">
            <span class="${leftWins ? 'wins' : ''}">${leftWins ? '🏆 ' : ''}${escapeHtml(r.leftName)} ${r.left}</span>
            —
            <span class="${rightWins ? 'wins' : ''}">${r.right} ${escapeHtml(r.rightName)}${rightWins ? ' 🏆' : ''}</span>
          </div>
        </div>
        <button class="delete" data-idx="${i}">Borrar</button>
      `;
      list.appendChild(row);
    });
    list.querySelectorAll('.delete').forEach(b => {
      b.addEventListener('click', () => {
        const idx = Number(b.dataset.idx);
        const arr = readResults();
        arr.splice(idx, 1);
        writeResults(arr);
        renderResults();
      });
    });
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  function openResults() {
    renderResults();
    $('modalResults').classList.add('open');
  }
  function closeResults() {
    $('modalResults').classList.remove('open');
  }

  // Eventos: tocar el panel suma punto, salvo el nombre o las flechas.
  function onPanelTap(side) {
    return e => {
      if (e.target.closest('.name-wrap')) return;
      if (e.target.closest('.arrows')) return;
      addPoint(side);
    };
  }
  $('teamLeft').addEventListener('click', onPanelTap('left'));
  $('teamRight').addEventListener('click', onPanelTap('right'));

  // Editar nombre: el input está readonly por defecto para no interferir
  // con el toque del panel. El lápiz lo desbloquea para escribir.
  document.querySelectorAll('.edit-name').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      const input = $(b.dataset.target);
      input.readOnly = false;
      input.focus();
      input.select();
    });
  });
  document.querySelectorAll('.name').forEach(inp => {
    inp.addEventListener('click', e => {
      e.stopPropagation();
      if (!inp.readOnly) return;
      inp.readOnly = false;
      inp.focus();
      inp.select();
    });
    inp.addEventListener('blur', () => { inp.readOnly = true; saveCurrent(); });
    inp.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); inp.blur(); }
    });
  });

  // Flechas + / − : ajustan el puntaje de su equipo de forma independiente.
  document.querySelectorAll('.arrows button').forEach(b => {
    b.addEventListener('click', e => {
      e.stopPropagation();
      adjust(b.dataset.side, Number(b.dataset.delta));
    });
  });

  $('btnSwitch').addEventListener('click', switchServe);
  $('btnUndo').addEventListener('click', undo);
  $('btnNew').addEventListener('click', newMatch);
  $('btnConfirmYes').addEventListener('click', confirmNewMatch);
  $('btnConfirmNo').addEventListener('click', () => $('modalConfirmNew').classList.remove('open'));
  $('btnResults').addEventListener('click', openResults);
  $('btnCloseModal').addEventListener('click', closeResults);
  $('modalResults').addEventListener('click', e => {
    if (e.target === $('modalResults')) closeResults();
  });
  $('modalConfirmNew').addEventListener('click', e => {
    if (e.target === $('modalConfirmNew')) $('modalConfirmNew').classList.remove('open');
  });

  migrateLegacyStorage();
  loadCurrent();
  render();

  // --- PWA: service worker + botón Instalar ---
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }

  let deferredPrompt = null;
  const btnInstall = $('btnInstall');
  const isInstalled = () =>
    window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone === true;

  if (!isInstalled()) {
    window.addEventListener('beforeinstallprompt', e => {
      e.preventDefault();
      deferredPrompt = e;
      btnInstall.style.display = '';
    });
  }
  btnInstall.addEventListener('click', async () => {
    if (!deferredPrompt) return;
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
    btnInstall.style.display = 'none';
  });
  window.addEventListener('appinstalled', () => {
    btnInstall.style.display = 'none';
    deferredPrompt = null;
  });
</script>
  <!-- Navegación "volver" unificada del ecosistema: chevron del header + botón
       físico de Android / gesto de iOS / atrás del navegador → cierra los modales;
       si no hay nada → dotrino.com. -->
  <script type="module">
    import { createBackNav } from 'https://cdn.jsdelivr.net/npm/@dotrino/nav@0.2/src/index.js'
    const nav = createBackNav()
    for (const id of ['modalResults', 'modalConfirmNew']) {
      const el = document.getElementById(id)
      if (!el) continue
      let handle = null
      const sync = () => {
        const open = el.classList.contains('open')
        if (open && !handle) handle = nav.open(() => el.classList.remove('open'))
        else if (!open && handle) { const h = handle; handle = null; h.close() }
      }
      new MutationObserver(sync).observe(el, { attributes: true, attributeFilter: ['class'] })
      sync()
    }
  </script>
</body>
